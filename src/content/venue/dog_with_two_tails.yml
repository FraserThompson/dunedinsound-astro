title: Dog With Two Tails
lat: -45.875379
lng: 170.502003
description: After serving a vital role for many years as a casual all ages performance space, and expanding into a venue next door, issues started arising for Dog with Two Tails around 2021 when <a href="https://www.odt.co.nz/news/dunedin/upset-noise-control-shut-concert-down-ws1bxofy" target="_blank">six police cars showed up to a folk gig</a> in response to a noise complaint from a neighboring short-term rental. Ultimately the noise issues couldn't be resolved, despite investment from DWTT into sound treatment, and sadly the venue was forced to close in 2023. If that wasn't enough, it's final send off was almost thwarted <a href="https://www.odt.co.nz/news/driver-flees-scene-after-crash-leaves-bar-in-ruins-ht5tc572" target="_blank">by a car through the window</a>... But the show went on, <a href="/gigs/dogfest---the-final-goodbye/">for one final night at least</a>.
date: 2015-07-01T00:00:00.000Z
died: 2023-04-01T00:00:00.000Z
