title: Dive
lat: -45.8665723
lng: 170.5092476
date: 2020-10-01T00:00:00.000Z
died: 2023-11-01T00:00:00.000Z
description: Dive operated for three years, filling a medium-ish venue sized hole in the Dunedin venue landscape. It <a href="https://web.archive.org/web/20261009211831/https://www.odt.co.nz/news/dunedin/fears-for-live-music-after-closure-of-dive-qqs6k6w5">closed in 2023</a> due to some plumbing dispute with the landlord or something, amid  stories of unpaid staff and general mismanagement. It's proprietor, Mike McLeod, was later <a href="https://web.archive.org/web/20261009212015/https://www.odt.co.nz/news/dunedin/sickening-and-unconscionable-dunedin-music-scene-figure-gave-15yo-drugs-paid-her-for-sex-nh65e9s7" target="_blank">imprisoned for sex and drug offences</a>.<br/><br/>The venue was briefly re-opened as <a href="/venues/dropkicks">Dropkicks</a>
aliases:
